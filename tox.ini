[tox]
envlist = py{311,312,313}-django{42,52}, py313-django52-coverage, pre-commit

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv:pre-commit]
deps =
    pre-commit
commands = pre-commit run --all-files

[testenv:py313-django52-coverage]
allowlist_externals = echo
commands =
    coverage erase
    coverage run ./manage.py test
    coverage report --include='quilljs_link*' --omit='*/tests/*' --omit='*/migrations/*'
    coverage html --include='quilljs_link*' --omit='*/tests/*' --omit='*/migrations/*'
    echo "opener htmlcov/index.html"
deps =
    Django>=5.2,<5.3
    lxml
    cssselect
    django-formfieldstash
    selenium
    coverage

[testenv]
commands = python manage.py test
setenv =
    DJANGO_SETTINGS_MODULE = quilljs_link.tests.settings
deps =
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    lxml
    cssselect
    django-formfieldstash
    selenium
